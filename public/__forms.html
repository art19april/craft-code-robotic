<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <title>Craft Code Robotic Forms</title>
  </head>
  <body>
    <form name="parent-callback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="parent-callback" />
      <input name="bot-field" />
      <input name="parent_name" type="text" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <input name="line_id" type="text" />
      <input name="child_age" type="text" />
      <input name="interest" type="text" />
      <input name="convenient_time" type="text" />
      <textarea name="message"></textarea>
      <input name="consent" type="checkbox" />
    </form>
  </body>
</html>
